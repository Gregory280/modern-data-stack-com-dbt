version: 1

models:

# ============================================================
# VIEW COM REGISTROS DE VENDAS DOS ÚLTIMOS 90 DIAS
# ============================================================
  - name: vw_vendas_ultimos_90_dias
    description: >
      View de vendas dos últimos 90 dias, incluindo hoje. Enriquece
      os itens com atributos do catálogo de produtos, como categoria,
      modelo, cor e tamanho, e informações do cadastro atual do cliente,
      como nome, estado e UF. Cada linha representa um item com
      correspondência nas dimensões de produto e cliente.
      Inclui todos os status de pedido e pagamento.

# ============================================================
# VIEW COM REGISTROS DE VENDAS DO ANO ATUAL
# ============================================================
  - name: vw_vendas_ano_atual
    description: >
      View de vendas desde 1º de janeiro do ano atual até hoje, com base
      na data de criação do pedido no fuso America/Sao_Paulo. Enriquece
      os itens com atributos do catálogo de produtos, como categoria,
      modelo, cor e tamanho, e informações do cadastro atual do cliente,
      como nome, estado e UF. Cada linha representa um item com
      correspondência nas dimensões de produto e cliente.
      Inclui todos os status de pedido e pagamento.

# ============================================================
# VIEW CLIENTES SEM COMPRAS
# ============================================================
  - name: vw_clientes_sem_compras
    description: >
      Clientes sem pedido registrado no campo ultimo_pedido do cadastro.
      Granularidade: uma linha por cliente. Inclui informações cadastrais,
      dados de contato e uma classificação pelo tempo desde o cadastro,
      apoiando análises de clientes que ainda não realizaram pedidos.

    columns:
      - name: dias_desde_cadastro
        description: >
          Quantidade de dias entre a data de cadastro do cliente e a data
          atual.

      - name: faixa_de_tempo
        description: >
          Classificação do tempo desde o cadastro nas faixas: Até 10 dias,
          11 a 30 dias, 31 a 60 dias, 61 a 120 dias e Mais de 120 dias.