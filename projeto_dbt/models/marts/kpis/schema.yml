version: 2

models:
# ============================================================
# RECEITA TOTAL
# ============================================================
  - name: kpi_receita_total
    description: >
      Calcular o faturamento total da loja virtual considerando as vendas válidas
      registradas no DW.

      - Considerar apenas pedidos realizados com sucesso.
      - Somar os valores de itens vendidos.
      - Considerar o histórico inteiro disponível.
    
    columns:
      - name: receita_total
        description: Valor total das vendas válidas em BRL.
  
# ============================================================
# TOTAL DE PEDIDOS
# ============================================================
  - name: kpi_total_pedidos
    description: >
      Calcular a quantidade de pedidos realizados no e-commerce, considerando
      pedidos cancelados.

      - Contabilizar cada pedido apenas uma vez.
      - Considerar todos os status de pedidos e pagamentos.
      - Considerar o histórico inteiro disponível.
    
    columns:
      - name: total_pedidos
        description: Quantidade total de pedidos realizados dentro do e-commerce

# ============================================================
# TICKET MEDIO
# ============================================================
  - name: kpi_ticket_medio
    description: >
      Calcula o valor médio gasto por pedido válido na loja.

      - Considerar somente pagamento_status = 'Pago'.
      - Considerar pedido_status IN ('Aberto', 'Fechado').
      - Somar os subtotais dos itens vendidos.
      - Contabilizar cada pedido apenas uma vez.
    
    columns:
      - name: ticket_medio
        description: Valor médio dos pedidos válidos.

# ============================================================
# TOTAL DE PEDIDOS PAGOS
# ============================================================
  - name: kpi_total_pedidos_pagos
    description: >
      Calcula a quantidade total de pedidos com pagamento confirmado.

      - Considerar somente pagamento_status = 'Pago'.
      - Considerar todo o histórico disponível.

    columns:
      - name: total_pedidos_pagos
        description: Quantidade de pedidos distintos com pagamento confirmado e status válido.

# ============================================================
# TOTAL DE CLIENTES COMPRADORES
# ============================================================
  - name: kpi_total_clientes_compradores
    description: >
      Calcula a quantidade total de clientes distintos
      que finalizaram o processo de compra, independente se depois
      o pedido foi reembolsado ou cancelado.

    columns:
      - name: total_clientes_compradores
        description: Quantidade de clientes únicos com pelo menos uma compra válida.

# ============================================================
# RECEITA MÉDIA POR CLIENTE
# ============================================================
  - name: kpi_receita_media_cliente
    description: >
      Calcula a receita média gerada por cliente comprador na loja.

      - Considerar somente pagamento_status = 'Pago'.
      - Considerar pedido_status IN ('Aberto', 'Fechado').
      - Dividir a receita total pela quantidade de clientes compradores.

    columns:
      - name: receita_media_cliente
        description: Receita média por cliente comprador, expressa em BRL.

# ============================================================
# TAXA DE CLIENTES COMPRADORES
# ============================================================
  - name: kpi_taxa_clientes_compradores
    description: >
      Calcula o percentual de clientes cadastrados que realizaram
      pelo menos uma compra válida na loja.

      - Considerar todos os clientes cadastrados.
      - Considerar compradores com pagamento_status = 'Pago'.
      - Considerar pedido_status IN ('Aberto', 'Fechado').
      - Dividir o total de clientes compradores pelo total de clientes cadastrados.

    columns:
      - name: taxa_clientes_compradores
        description: Percentual de clientes cadastrados que realizaram pelo menos uma compra válida, em escala de 0 a 100.

# ============================================================
# TOTAL DE CLIENTES
# ============================================================
  - name: kpi_total_clientes
    description: >
      Calcula a quantidade total de clientes cadastrados na loja.

      - Considerar todos os clientes cadastrados.
      - Incluir clientes que nunca realizaram compras.

    columns:
      - name: total_clientes
        description: Quantidade total de clientes distintos cadastrados na loja.

# ============================================================
# TOTAL DE PEDIDOS CANCELADOS
# ============================================================
  - name: kpi_total_pedidos_cancelados
    description: >
      Calcula a quantidade total de pedidos cancelados na loja.

      Regras de negócio:
      - Considerar somente pedido_status = 'Cancelado'.
      - Contabilizar cada pedido cancelado apenas uma vez.

    columns:
      - name: total_pedidos_cancelados
        description: Quantidade total de pedidos distintos com status cancelado, independentemente do pagamento.

# ============================================================
# RECEITA ACUMULADA DO MÊS ATUAL X MÊS PASSADO
# ============================================================
  - name: kpi_receita_mtd_comparativo
    description: >
      Calcula a receita acumulada do mês atual (Month to Date)
      e compara com o mesmo período do mês anterior.

      - Considerar somente pedido_status IN ('Aberto', 'Fechado').
      - Considerar somente pagamento_status = 'Pago'.
      - Calcular a receita do primeiro dia do mês atual até a data corrente.
      - Comparar com o período equivalente do mês anterior.
      - Calcular a variação relativa entre os dois períodos.

    columns:
      - name: receita_mtd_atual
        description: >
          Receita acumulada desde o primeiro dia do mês atual
          até a data corrente.

      - name: receita_mtd_anterior
        description: >
          Receita acumulada no mês anterior, desde seu primeiro
          dia até a data equivalente à data corrente.

      - name: variacao_percentual
        description: >
          Variação relativa entre a receita MTD atual e a receita
          MTD do mês anterior, calculada pela diferença entre
          os valores dividida pela receita do período anterior.

# ============================================================
# KPI RECEITA YTD — COMPARATIVO ANUAL
# ============================================================
  - name: kpi_receita_ytd_comparativo
    description: >
      Compara a receita bruta acumulada desde 1º de janeiro até hoje
      com o mesmo período do ano anterior, usando a data de criação
      do pedido no fuso America/Sao_Paulo. Considera pedidos com status
      Aberto ou Fechado e pagamento Pago. Retorna uma linha.

    columns:
      - name: receita_ytd_atual
        description: Soma dos subtotais dos itens desde 1º de janeiro do ano atual até hoje.

      - name: receita_ytd_anterior
        description: >
          Soma dos subtotais dos itens desde 1º de janeiro do ano anterior
          até a data equivalente à de hoje naquele ano, antes de descontos
          e frete, arredondada a duas casas decimais.

      - name: variacao_percentual
        description: Variação relativa entre a receita YTD atual e a anterior, calculada como (atual - anterior) / anterior.