version: 2

models:
# ============================================================
# DIMENSÃO PRODUTO
# ============================================================
  - name: dim_produto
    description: >
      Dimensão do catálogo com uma linha por variante de produto.
      Permite analisar vendas por categoria, modelo, cor e numeração.
    columns:
      - name: variante_id
        description: Identificador único da variante e chave usada na fato de vendas.
        data_tests:
          - not_null
          - unique

      - name: produto_id
        description: Identificador do produto, compartilhado pelas suas variantes.
        data_tests:
          - not_null

      - name: categoria
        description: Categoria do calçado, como tênis ou sandália.

      - name: modelo
        description: Modelo do calçado dentro da categoria.

      - name: cor
        description: Cor do produto no catálogo.

      - name: nome
        description: Nome do produto no catálogo, incluindo modelo e cor.

      - name: tamanho
        description: Numeração do calçado para a variante.
        data_tests:
          - not_null

      - name: sku
        description: Código comercial da variante, único no catálogo atual.
        data_tests:
          - not_null
          - unique

      - name: preco
        description: Preço unitário de catálogo. O preço praticado na compra fica no item do pedido.
        data_tests:
          - not_null

      - name: nome_modelo
        description: Rótulo que combina categoria e modelo, como Tênis Modelo 1.

      - name: nome_variante
        description: Rótulo que combina o nome do produto e a numeração do calçado.

# ============================================================
# DIMENSÃO CLIENTE
# ============================================================
  - name: dim_cliente
    description: >
      Cadastro de clientes com uma linha por cliente, incluindo dados
      de contato, endereço padrão e informações de compra fornecidas
      pela origem.
    columns:
      - name: cliente_id
        description: Identificador único do cliente e chave usada para relacionar suas compras.
        data_tests:
          - not_null
          - unique

      - name: nome
        description: Nome completo do cliente.

      - name: email
        description: E-mail do cliente, padronizado na staging.

      - name: celular
        description: Número de celular do cliente. Pode ser nulo quando não informado.

      - name: conta_ativada
        description: Indica se a conta do cliente foi ativada.

      - name: criado_em
        description: Data e hora de criação do cadastro na origem.

      - name: atualizado_em
        description: Data e hora da última atualização do cadastro na origem.

      - name: endereco
        description: Logradouro do endereço padrão do cliente.

      - name: cidade
        description: Cidade do endereço padrão do cliente.

      - name: estado
        description: Nome completo do estado do endereço padrão do cliente.

      - name: uf
        description: Sigla da unidade federativa do endereço padrão do cliente.

      - name: total_gasto
        description: Total gasto pelo cliente conforme informado pela origem.

      - name: ultimo_pedido
        description: Identificador do último pedido informado pela origem. Pode ser nulo para clientes sem pedidos.

# ============================================================
# DIMENSÃO DATA
# ============================================================
  - name: dim_data
    description: >
      Calendário com uma linha por dia, de 1º de janeiro de 2025 a
      31 de dezembro de 2029, incluindo dias sem vendas. Permite agrupar
      e filtrar os eventos da loja por dia, mês, trimestre e ano.
    columns:
      - name: data
        description: Data do calendário e chave única da dimensão.
        data_tests:
          - not_null
          - unique

      - name: ano
        description: Ano da data.

      - name: ano_mes
        description: Ano e mês no formato AAAA-MM, como 2025-01.

      - name: trimestre
        description: Número do trimestre no ano, de 1 a 4.

      - name: mes
        description: Número do mês no ano, de 1 a 12.

      - name: nome_mes
        description: Nome completo do mês em inglês, como January.

      - name: dia
        description: Dia do mês, de 1 a 31 conforme o mês.

      - name: dia_semana
        description: Número do dia da semana no BigQuery, de 1 para domingo a 7 para sábado.

# ============================================================
# FATO VENDA
# ============================================================
  - name: fato_venda
    description: >
      Itens dos pedidos com uma linha por item. Preserva os status
      do pedido e do pagamento para que os relatórios possam definir
      quais registros entram em cada métrica de vendas.
    columns:
      - name: item_id
        description: Identificador único do item e chave da fato.
        data_tests:
          - not_null
          - unique

      - name: pedido_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: cliente_id
        description: Identificador do cliente associado ao pedido.
        data_tests:
          - relationships:
              to: ref('dim_cliente')
              field: cliente_id

      - name: criado_em
        description: Data e hora de criação do pedido na origem.

      - name: atualizado_em
        description: Data e hora da última atualização do pedido na origem.

      - name: pedido_status
        description: Status atual do pedido na origem.

      - name: pagamento_status
        description: Status atual do pagamento do pedido na origem.

      - name: variante_id
        description: Identificador da variante comprada, usado para relacionar o item ao catálogo.
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_produto')
              field: variante_id

      - name: sku
        description: Código comercial da variante registrado no item do pedido.

      - name: nome_produto
        description: Nome do produto registrado no momento da compra.

      - name: quantidade
        description: Número de unidades registradas no item do pedido.

      - name: preco_unitario
        description: Preço por unidade registrado no momento da compra.

      - name: subtotal
        description: >
          Valor bruto do item, calculado como quantidade multiplicada
          pelo preço unitário, antes de descontos e frete.