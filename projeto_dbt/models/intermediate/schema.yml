version: 2

models:
  # ============================================================
  # INTERMEDIATE ITENS_PEDIDOS_DETALHADOS
  # ============================================================
  - name: int_itens_pedidos_detalhados
    description: >
      Itens enriquecidos com o cliente, as datas e os status do pedido.
      Cada linha representa um item com pedido correspondente.
    columns:
      - name: item_id
        description: Identificador único do item do pedido.
        data_tests:
          - not_null
          - unique

      - name: pedido_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: cliente_id
        description: Identificador do cliente que realizou o pedido.

      - name: criado_em
        description: Data e hora de criação do pedido na origem.

      - name: atualizado_em
        description: Data e hora da última atualização do pedido na origem.

      - name: pedido_status
        description: Status atual do pedido.

      - name: pagamento_status
        description: Status atual do pagamento do pedido.

      - name: variante_id
        description: Identificador da variante comprada.

      - name: sku
        description: SKU da variante registrado no item do pedido.

      - name: nome_produto
        description: Nome do produto registrado no momento da compra.

      - name: quantidade
        description: Número de unidades registradas no item.

      - name: preco_unitario
        description: Preço por unidade registrado no momento da compra.

      - name: subtotal
        description: >
          Valor bruto do item, calculado como quantidade multiplicada
          pelo preço unitário, antes de descontos e frete.

  # ============================================================
  # INTERMEDIATE ROTULO_PRODUTOS
  # ============================================================
  - name: int_rotulo_produtos
    description: >
      Catálogo com uma linha por variante, enriquecido com rótulos
      de modelo e variante para uso em filtros e relatórios.
    columns:
      - name: produto_id
        description: Identificador do produto, compartilhado pelas suas variantes.

      - name: variante_id
        description: Identificador único da variante no catálogo.
        data_tests:
          - not_null
          - unique

      - name: categoria
        description: Categoria do calçado, como tênis ou sandália.

      - name: modelo
        description: Modelo do calçado dentro da categoria.

      - name: cor
        description: Cor do produto no catálogo.

      - name: nome_produto
        description: Nome do produto no catálogo, incluindo modelo e cor.

      - name: tamanho
        description: Numeração do calçado para a variante.

      - name: sku
        description: Código comercial da variante no catálogo.

      - name: preco_catalogo
        description: Preço unitário informado no catálogo.

      - name: nome_modelo
        description: Rótulo que combina a categoria e o modelo do calçado.

      - name: nome_variante
        description: Rótulo que combina o nome do produto e a numeração.