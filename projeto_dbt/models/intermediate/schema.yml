version: 1

models:
  
# ============================================================
# INTERMEDIATE ITENS_PEDIDOS_DETALHADOS
# ============================================================
  - name: int_itens_pedidos_detalhados
    description: >
      Reune informações detalhadas sobre os itens de cada pedido, incluindo dados do produto, quantidade, 
      preço unitário e total, além de informações do pedido e do cliente.
      Granularidade: 1 linha = 1 item de pedido.
    columns:
      - name: item_id
        description: Identificador único do item do pedido.
      
      - name: pedido_id
        description: Identificador do pedido ao qual o item pertence.

      - name: cliente_id
        description: Identificador do cliente que realizou o pedido.
      
      - name: criado_em
        description: Data e hora em que o item do pedido foi criado.

      - name: atualizado_em
        description: Data e hora em que o item do pedido foi atualizado pela última vez.

      - name: pedido_status
        description: Status atual do pedido.

      - name: pagamento_status
        description: Status atual do pagamento do pedido.
      
      - name: pedido_id
        description: Identificador do pedido ao qual o item pertence.
      
      - name: variante_id
        description: Identificador da variante do produto.
      
      - name: sku
        description: Código SKU do produto.

      - name: nome_produto
        description: Nome do produto.

      - name: quantidade
        description: Quantidade do item no pedido.
      
      - name: preco_unitario
        description: Preço unitário do item no pedido.

      - name: subtotal
        description: Subtotal do item no pedido (quantidade * preço unitário).

