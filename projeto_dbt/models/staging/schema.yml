version: 1

models:
  
# ============================================================
# STAGING CLIENTES
# ============================================================
  - name: stg_clientes
    description: >
      Tabela de clientes cadastrados no sistema com nome e formatos padronizados. 
      Granularidade: 1 linha = 1 cliente.
    columns:
      - name: cliente_id
        description: Identificador único do cliente.
        tests:
          - not_null
          - unique

      - name: nome
        description: Nome completo do cliente.
        tests:
          - not_null

      - name: email
        description: Endereço de e-mail do cliente padronizado.
        tests:
          - not_null
          - unique

      - name: celular
        description: Número de celular do cliente.

      - name: conta_ativada
        description: Indica se a conta do cliente foi ativada com a confirmação de e-mail.

      - name: criado_em
        description: Data e hora em que o registro do cliente foi criado no sistema.

      - name: atualizado_em
        description: Data e hora da última atualização do registro do cliente no sistema.

      - name: endereco
        description: Endereço completo do cliente, incluindo rua e número.
        tests:
          - not_null

      - name: cidade
        description: Cidade do cliente.
        tests:
          - not_null

      - name: estado
        description: Estado do cliente.
        tests:
          - not_null

      - name: uf
        description: Unidade federativa (UF) do cliente.
        tests:
          - not_null

      - name: total_gasto
        description: Valor total gasto pelo cliente registrado no sistema.

# ============================================================
# STAGING PEDIDOS
# ============================================================
  - name: stg_pedidos
    description: >
      Tabela de pedidos realizados no sistema com informações detalhadas sobre cada pedido.
      Granularidade: 1 linha = 1 pedido.
    columns:
      - name: pedido_id
        description: Identificador único do pedido.
        tests:
          - not_null
          - unique

      - name: pedido_numero
        description: Número comercial do pedido.
        tests:
          - not_null

      - name: loja_id
        description: Identificador da loja onde o pedido foi realizado.
        tests:
          - not_null

      - name: cliente_id
        description: Identificador do cliente que realizou o pedido.
        tests:
          - not_null

      - name: criado_em
        description: Data e hora em que o pedido foi criado no sistema.
        tests:
          - not_null

      - name: atualizado_em
        description: Data e hora da última atualização do pedido no sistema.

      - name: status_envio
        description: Status atual do envio do pedido.

      - name: pedido_status
        description: Status atual do pedido no sistema.

      - name: pagamento_status
        description: Status atual do pagamento do pedido.

      - name: pago_em
        description: Data e hora em que o pedido foi pago.

      - name: metodo_pagamento
        description: Método de pagamento utilizado para o pedido, podendo variar em Pix, Boleto Bancário e Cartão de Crédito.

      - name: parcelas_pagamento
        description: Número de parcelas do pagamento do pedido, caso aplicável.

      - name: cancelado_em
        description: Data e hora em que o pedido foi cancelado, caso aplicável.

      - name: fechado_em
        description: Data e hora em que o pedido foi fechado, caso aplicável.

      - name: motivo_cancelamento
        description: Motivo do cancelamento do pedido, caso aplicável.

      - name: subtotal
        description: Valor do subtotal do pedido, sem incluir taxas e descontos.

      - name: desconto
        description: Valor do desconto aplicado ao pedido, caso aplicável.

      - name: desconto_cupom
        description: Valor do desconto aplicado ao pedido através de cupom, caso aplicável.

      - name: frete_cobrado
        description: Valor do frete cobrado no pedido, caso aplicável.

      - name: total
        description: Valor total do pedido, incluindo subtotal, descontos e frete.

      - name: total_pago_cliente
        description: Valor total pago pelo cliente no pedido, considerando descontos e frete.

      - name: endereco_entrega
        description: Endereço completo de entrega do pedido, incluindo rua e número.

      - name: cidade_entrega
        description: Cidade de entrega do pedido.

      - name: estado_entrega
        description: Estado de entrega do pedido.

# ============================================================
# STAGING ITENS_PEDIDOS
# ============================================================
  - name: stg_itens_pedidos
    description: >
      Itens dos pedidos, com uma linha por item.
    columns:
      - name: item_id
        description: Identificador do item na base atual.
        data_tests:
          - not_null
          - unique

      - name: pedido_id
        description: Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null

      - name: quantidade
        description: Número de unidades do item.
        data_tests:
          - not_null

      - name: preco_unitario
        description: Preço por unidade registrado no momento da compra.
        data_tests:
          - not_null

# ============================================================
# STAGING PRODUTOS
# ============================================================
  - name: stg_produtos
    description: >
      Catálogo de produtos com uma linha por variante.
      Cada variante combina um produto e uma numeração.
      Os atributos do produto se repetem entre suas variantes.
    columns:
      - name: produto_id
        description: Identificador do produto no catálogo.
        data_tests:
          - not_null

      - name: variante_id
        description: Identificador único da variante no catálogo.
        data_tests:
          - not_null
          - unique

      - name: categoria
        description: Categoria do produto, como tênis ou sandália.

      - name: modelo
        description: Modelo do calçado dentro da categoria.

      - name: cor
        description: Cor do produto no catálogo.

      - name: nome_produto
        description: Nome do produto, incluindo modelo e cor.

      - name: tamanho
        description: Numeração do calçado para a variante.
        data_tests:
          - not_null

      - name: sku
        description: Código comercial único da variante.
        data_tests:
          - not_null
          - unique

      - name: preco
        description: >
          Preço unitário informado no catálogo, convertido para NUMERIC.
          O preço praticado na compra fica registrado nos itens do pedido.
        data_tests:
          - not_null